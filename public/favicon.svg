<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="astraaSphere" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="astraaOrbit" x1="6" y1="42" x2="58" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#050814" />
  <!-- Back Orbital Arc -->
  <path
    d="M 10 38 C 6 28, 22 16, 42 18 C 52 19, 57 24, 54 30"
    stroke="url(#astraaOrbit)"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.45"
  />
  <!-- Planetary Sphere -->
  <circle cx="32" cy="32" r="15.5" fill="url(#astraaSphere)" />
  <!-- Planetary Meridian & Limb Highlight -->
  <path
    d="M 22 20 C 26 26, 26 38, 22 44"
    stroke="#E0F2FE"
    stroke-width="1.35"
    stroke-opacity="0.55"
    stroke-linecap="round"
  />
  <path
    d="M 18 30 C 27 27, 37 27, 46 30"
    stroke="#E0F2FE"
    stroke-width="1.2"
    stroke-opacity="0.4"
    stroke-linecap="round"
  />
  <!-- Front Orbital Trajectory -->
  <path
    d="M 54 27 C 58 34, 42 46, 20 45 C 11 44, 7 39, 10 33"
    stroke="url(#astraaOrbit)"
    stroke-width="2.8"
    stroke-linecap="round"
  />
  <!-- Celestial Navigation Star (Astraa Polar Beacon) -->
  <path
    d="M 49 11 L 50.6 15.4 L 55 17 L 50.6 18.6 L 49 23 L 47.4 18.6 L 43 17 L 47.4 15.4 Z"
    fill="#E0F2FE"
  />
  <!-- Secondary Orbital Moon Node -->
  <circle cx="15" cy="43" r="2.2" fill="#38BDF8" />
</svg>
